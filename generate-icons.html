<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイコン生成ツール</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .preview {
            display: flex;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .icon-preview {
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            display: block;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            background: #4a9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #5ba;
        }
        .instructions {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>習慣トラッカー アイコン生成ツール</h1>

        <p>以下のボタンをクリックして、各サイズのアイコンをダウンロードしてください。</p>

        <div class="preview">
            <div class="icon-preview">
                <h3>192x192</h3>
                <canvas id="canvas-192" width="192" height="192"></canvas>
                <button onclick="downloadIcon(192)">ダウンロード</button>
            </div>

            <div class="icon-preview">
                <h3>512x512</h3>
                <canvas id="canvas-512" width="512" height="512"></canvas>
                <button onclick="downloadIcon(512)">ダウンロード</button>
            </div>

            <div class="icon-preview">
                <h3>180x180 (Apple)</h3>
                <canvas id="canvas-180" width="180" height="180"></canvas>
                <button onclick="downloadIcon(180, true)">ダウンロード</button>
            </div>
        </div>

        <div class="instructions">
            <h3>使い方</h3>
            <ol>
                <li>各サイズの「ダウンロード」ボタンをクリック</li>
                <li>ダウンロードしたファイルを <code>habit-tracker/icons/</code> フォルダに保存</li>
                <li>ファイル名は以下の通り：
                    <ul>
                        <li><code>icon-192.png</code></li>
                        <li><code>icon-512.png</code></li>
                        <li><code>apple-touch-icon.png</code></li>
                    </ul>
                </li>
            </ol>
        </div>
    </div>

    <script>
        function drawIcon(ctx, size) {
            // 背景（黒）
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, size, size);

            // チェックマーク（緑）
            ctx.strokeStyle = '#44aa99';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = size * 0.08;

            ctx.beginPath();
            ctx.moveTo(size * 0.25, size * 0.5);
            ctx.lineTo(size * 0.42, size * 0.67);
            ctx.lineTo(size * 0.75, size * 0.33);
            ctx.stroke();
        }

        function generateIcon(size) {
            const canvas = document.getElementById(`canvas-${size}`);
            const ctx = canvas.getContext('2d');
            drawIcon(ctx, size);
        }

        function downloadIcon(size, isApple = false) {
            const canvas = document.getElementById(`canvas-${size}`);
            const filename = isApple ? 'apple-touch-icon.png' : `icon-${size}.png`;

            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // ページ読み込み時にすべてのアイコンを生成
        window.addEventListener('load', () => {
            generateIcon(192);
            generateIcon(512);
            generateIcon(180);
        });
    </script>
</body>
</html>
